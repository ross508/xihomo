[package]
name = "xihomo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
core-foundation = "0.10"
flate2 = "1"
# runtime_shaders: compile Metal shaders at launch so the build needs no separate Metal Toolchain download.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSResponder", "NSRunningApplication"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
tray-icon = { version = "0.26", default-features = false }
yaml_serde = "0.10"

[dev-dependencies]
# In-process UI tests (TestAppContext). The Linux backends this feature also names are target-gated.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "test-support"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
